apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fraud-runtime
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-kafka
  template:
    metadata:
      labels:
        app: fraud-kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:8.3.2
          ports:
            - containerPort: 9092
            - containerPort: 29093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@fraud-kafka:29093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://fraud-kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-kafka
spec:
  selector:
    app: fraud-kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-api
  template:
    metadata:
      labels:
        app: fraud-api
    spec:
      containers:
        - name: api
          image: fraud-detection-platform:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_DIR
              value: /models/baseline
            - name: REPORT_MODELS
              value: /reports/models
            - name: RUNTIME_DIR
              value: /runtime
            - name: FEAST_REPO_PATH
              value: /feast_repo
          volumeMounts:
            - name: models
              mountPath: /models/baseline
              readOnly: true
            - name: reports
              mountPath: /reports/models
            - name: feast-repo
              mountPath: /feast_repo
              readOnly: true
            - name: runtime
              mountPath: /runtime
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
      volumes:
        - name: models
          hostPath:
            path: /mnt/fraudproject/models/baseline
            type: Directory
        - name: reports
          hostPath:
            path: /mnt/fraudproject/reports/models
            type: Directory
        - name: feast-repo
          hostPath:
            path: /mnt/fraudproject/deployment/feast_repo
            type: Directory
        - name: runtime
          persistentVolumeClaim:
            claimName: fraud-runtime
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-api
spec:
  selector:
    app: fraud-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-consumer
  template:
    metadata:
      labels:
        app: fraud-consumer
    spec:
      containers:
        - name: consumer
          image: fraud-detection-platform:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.consumer"]
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: fraud-kafka:9092
            - name: KAFKA_RAW_TOPIC
              value: transactions.raw
            - name: KAFKA_SCORED_TOPIC
              value: transactions.scored
            - name: SCORING_API_URL
              value: http://fraud-api:8000/score
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-dashboard
  template:
    metadata:
      labels:
        app: fraud-dashboard
    spec:
      containers:
        - name: dashboard
          image: fraud-detection-platform:local
          imagePullPolicy: IfNotPresent
          command: ["streamlit", "run", "/app/dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]
          env:
            - name: SCORING_API_URL
              value: http://fraud-api:8000
          ports:
            - containerPort: 8501
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-dashboard
spec:
  type: NodePort
  selector:
    app: fraud-dashboard
  ports:
    - port: 8501
      targetPort: 8501
      nodePort: 30851
